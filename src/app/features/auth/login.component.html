<div class="min-h-screen flex items-center justify-center bg-clinico-secundario px-4">
  <div class="w-full max-w-lg">
    <div class="flex flex-col items-center text-center mb-8">
      <img
        src="assets/logo-vitali.jpg"
        alt="Vitali · Centro Psicológico"
        class="w-44 h-44 rounded-full object-cover ring-4 ring-white/60 shadow-lg mb-5"
      />
      <p class="text-base text-white">Sistema de Gestión de Historias Clínicas</p>
    </div>

    <div class="card p-10">
      <h1 class="font-display text-2xl font-semibold text-clinico-texto mb-8 text-center">Iniciar sesión</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <label class="field-label text-base">
          Usuario
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            class="field text-base py-3"
          />
        </label>

        <label class="field-label text-base">
          Contraseña
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            class="field text-base py-3"
          />
        </label>

        @if (error()) {
          <p class="text-sm text-red-600">{{ error() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || cargando()" class="btn-primary w-full justify-center flex text-base py-3">
          {{ cargando() ? "Ingresando..." : "Iniciar sesión" }}
        </button>
      </form>
    </div>
  </div>
</div>
